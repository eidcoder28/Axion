<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axion Light</title>

    <script type="importmap">
        {
            "imports": {
                "axios": "https://cdn.jsdelivr.net/npm/axios@1.20.0/+esm",
                "cash-dom": "https://cdn.jsdelivr.net/npm/cash-dom@8.1.0/dist/cash.esm.js",
                "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.4.8/+esm",
                "file-saver": "https://cdn.jsdelivr.net/npm/file-saver@2.0.5/+esm",
                "marked": "https://cdn.jsdelivr.net/npm/marked@15.0.0/+esm",
                "sweetalert2": "https://cdn.jsdelivr.net/npm/sweetalert2@11/+esm",
                "validator": "https://cdn.jsdelivr.net/npm/validator@13.15.35/+esm",
                "notiflix": "https://cdn.jsdelivr.net/npm/notiflix@3.3.0/dist/notiflix-aio-3.3.0.min.js/+esm",
                "@shared/": "/shared/",
                "@app/": "/js/"
            }
        }
    </script>

    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href=" https://cdn.jsdelivr.net/npm/notiflix@3.3.0/src/notiflix.min.css " rel="stylesheet">
    <link href=" https://cdn.jsdelivr.net/npm/notiflix@3.3.0/src/notiflix.min.css " rel="stylesheet">
    <link rel="icon" href="/favicon.ico" />
</head>

<body>
    <header>
        <a href="/" class="logo">Axion</a>
        <div class="center">
            <i class="fas fa-user-plus icon-helper" id="signup-btn" role="button" tabindex="0"></i>
            <div id="auth-buttons">
                <i class="fas fa-user icon-helper" id="profile-btn" role="button" tabindex="0"></i>
                <i class="fas fa-plus icon-helper" id="create-post-btn" role="button" tabindex="0"></i>
                <i class="fas fa-sign-out icon-helper" id="signout-btn" role="button" tabindex="0"></i>
            </div>
        </div>
    </header>

    <main>
        <div id="posts-container">
            <!--Posts will be loaded here -->
        </div>

        <div class="center" id="posts-navigation-container"></div>
    </main>

    <footer>
        <p>&copy; 2026 Axion</p>
    </footer>

    <script type="module">
        import "@app/main.js";
    </script>
</body>

</html>
